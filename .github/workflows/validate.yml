name: Validate dashboard

on:
  pull_request:
    paths:
      - "web/**"
      - "scripts/**"
      - "supabase/functions/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - "supabase/functions/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check whitespace errors
        run: git diff --check HEAD^

      - name: Check custom domain declaration
        run: grep -qx 'dashboard.utiskogen.se' web/CNAME
